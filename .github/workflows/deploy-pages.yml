name: Deploy web demo to GitHub Pages

# One workflow, one gate. This lab used to split them: ci.yml ran the Rust
# workspace suite and the web-demo tests on pull_request and carried the
# Dependabot auto-merge, while this file ran the deploy on push to main -- and
# only this file ran "Verify WASM binary integrity". So a bump could merge after
# clearing ci.yml and then fail the deploy's heavier gate on main, where no pull
# request was watching. Now `deploy` and `dependabot-auto-merge` both need the
# SAME jobs: the Rust suite (`test`, moved here verbatim from ci.yml) and the
# web-demo build (`build`, which already ran tests, build and the browser suite,
# and now also runs ci.yml's ESLint step). ci.yml is deleted rather than kept
# beside it: a second copy of a gate is how the two drift apart.
#
# The push trigger no longer carries a `paths:` filter. ci.yml ran the Rust
# suite on every push to main; keeping the filter here would have stopped that
# for any push outside web-demo/.
on:
  push:
    branches: [main]
  # The gate has to judge pull requests too, or auto-merge has nothing to wait on.
  pull_request:
    branches: [main]
  # Allow triggering manually from the Actions tab, and required by the
  # post-merge dispatch at the bottom of this file.
  workflow_dispatch:

# Grant the GITHUB_TOKEN the permissions required for Pages deployment
permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  # Keyed by ref, NOT a bare `pages`. Now that pull_request is a trigger and
  # cancel-in-progress is on, a bare group would let a PR run cancel a live main
  # deploy.
  group: pages-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (default features)
        run: cargo build --workspace

      - name: Run tests (default features)
        run: cargo test --workspace

      - name: Run tamper, corpus, nonce, zeroize, and differential tests
        run: cargo test --workspace -p qv-core --test tamper_tests --test corpus_tests --test nonce_tests --test zeroize_tests --test differential_tests

      - name: Run tests (wasm feature on qv-core)
        run: cargo test -p qv-core --features wasm

      - name: Clippy (default features)
        run: cargo clippy --workspace -- -W clippy::all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install cargo-fuzz
        run: |
          rustup install nightly --no-self-update
          cargo +nightly install cargo-fuzz --locked 2>/dev/null || true

      - name: Fuzz container parser (short smoke run)
        working-directory: crates/qv-core
        run: |
          cargo +nightly fuzz run fuzz_container_parse -- -max_total_time=30 -max_len=4096

      - name: Fuzz decrypt pipeline (short smoke run)
        working-directory: crates/qv-core
        run: |
          cargo +nightly fuzz run fuzz_decrypt_pipeline -- -max_total_time=30 -max_len=4096

      - name: Fuzz KEM handshake (short smoke run)
        working-directory: crates/qv-core
        run: |
          cargo +nightly fuzz run fuzz_kem_handshake -- -max_total_time=30 -max_len=4096

      - name: Fuzz signature verify (short smoke run)
        working-directory: crates/qv-core
        run: |
          cargo +nightly fuzz run fuzz_signature_verify -- -max_total_time=30 -max_len=4096

      - name: Fuzz WASM API boundary (short smoke run)
        working-directory: crates/qv-core
        run: |
          cargo +nightly fuzz run fuzz_wasm_api -- -max_total_time=30 -max_len=4096

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories bans sources

  build:
    name: Build Vite static bundle
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: 'npm'
          cache-dependency-path: web-demo/package-lock.json

      - name: Verify WASM binary integrity
        working-directory: web-demo
        run: |
          # NOTE: This step is a *consistency check* — it verifies that the
          # committed .wasm files match the committed .wasm.sha256 hashes.
          # It does NOT prove the WASM was built from the source in this repo.
          # A full reproducibility guarantee requires rebuilding from source
          # using Emscripten (see wasm/build.sh) and comparing outputs.
          # Any change to the .wasm files must be accompanied by a matching
          # update to the .wasm.sha256 files in the same PR and reviewed.
          SMAUG_EXPECTED=$(cat public/smaug.wasm.sha256 | tr -d '[:space:]')
          HAETAE_EXPECTED=$(cat public/haetae.wasm.sha256 | tr -d '[:space:]')
          SMAUG_ACTUAL=$(sha256sum public/smaug.wasm | awk '{print $1}')
          HAETAE_ACTUAL=$(sha256sum public/haetae.wasm | awk '{print $1}')
          if [ "$SMAUG_ACTUAL" != "$SMAUG_EXPECTED" ]; then
            echo "ERROR: smaug.wasm SHA-256 mismatch"
            echo "  expected: $SMAUG_EXPECTED"
            echo "  actual:   $SMAUG_ACTUAL"
            exit 1
          fi
          if [ "$HAETAE_ACTUAL" != "$HAETAE_EXPECTED" ]; then
            echo "ERROR: haetae.wasm SHA-256 mismatch"
            echo "  expected: $HAETAE_EXPECTED"
            echo "  actual:   $HAETAE_ACTUAL"
            exit 1
          fi
          echo "WASM integrity verified."

      - name: Install dependencies
        working-directory: web-demo
        run: npm ci

      - name: Run tests
        working-directory: web-demo
        run: npm run test

      # From ci.yml's test-web-demo job, folded in when that file was removed.
      - name: Lint (ESLint)
        working-directory: web-demo
        run: npm run lint

      - name: Build Vite bundle
        working-directory: web-demo
        run: npm run build
        # base path '/crypto-lab-quantum-vault-kpqc/' is set permanently in vite.config.ts

      - name: Install Playwright browser
        working-directory: web-demo
        run: npx playwright install --with-deps chromium

      # The whole browser suite: e2e/vault.spec.ts (the real seal/open pipeline,
      # both failure modes and the tamper) plus e2e/a11y.spec.ts (WCAG A/AA in
      # both themes at 1280px and 380px). Running only test:a11y here meant the
      # functional suite never blocked a deploy — a broken seal could ship so
      # long as the broken page was accessible.
      - name: Browser pipeline and accessibility gate
        working-directory: web-demo
        run: npm run test:e2e

      # From ci.yml's e2e-web-demo job, which ran this same `npm run test:e2e`.
      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web-demo/playwright-report/
          retention-days: 7

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: web-demo/dist

  deploy:
    name: Deploy to GitHub Pages
    needs: [test, build]
    # A pull request is gated, never published. `!= 'pull_request'` and NOT
    # `== 'push'`: the latter also skips workflow_dispatch, which the post-merge
    # dispatch below depends on.
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  # Dependabot only. `needs: [test, build]` is the whole safety argument -- a bump can
  # merge itself only once this lab's entire PR gate went green, so the gate
  # decides rather than the version number. A major that actually breaks the
  # lab fails the gate and the PR stays open for a human.
  dependabot-auto-merge:
    needs: [test, build]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      # actions: write is required by the deploy dispatch below. Without it
      # `gh workflow run` returns HTTP 403 "Resource not accessible by
      # integration", the merged bump never deploys, and a `|| echo` fallback
      # hides it.
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Merge any bump whose gate went green
        # Retry: a sibling PR merging first moves main underneath us and GitHub
        # rejects with "Base branch was modified". That is benign, so try again
        # rather than failing the run over a race.
        run: |
          merged=""
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt failed; base branch may have moved - retrying"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::warning::gate passed but the merge did not land after 3 attempts;"
            echo "::warning::leaving this PR open - Dependabot will rebase and retry."
            exit 0
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
