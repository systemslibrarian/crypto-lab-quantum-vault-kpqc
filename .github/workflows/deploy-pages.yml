name: Deploy web demo to GitHub Pages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# Tests and builds receive no publishing token. The two publishing jobs below
# opt into Pages/OIDC only after every unprivileged gate has passed.
permissions:
  contents: read

concurrency:
  group: pages-${{ github.ref }}
  # Supersede stale PR checks, but never cancel a main deployment midway.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Rust build, tests, fuzz smoke, and audits
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v6
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (default development feature)
        run: cargo build --workspace

      - name: Run tests (default development feature)
        run: cargo test --workspace

      - name: Run tamper, corpus, nonce, zeroize, and differential tests
        run: cargo test --workspace -p qv-core --test tamper_tests --test corpus_tests --test nonce_tests --test zeroize_tests --test differential_tests

      - name: Run tests (wasm feature on qv-core)
        run: cargo test -p qv-core --features wasm

      - name: Prove the development backend is absent when disabled
        run: |
          cargo test -p qv-core --no-default-features
          cargo check -p qv-core --release --no-default-features
          cargo check -p qv-cli --release --no-default-features

      - name: Prove an unacknowledged development release is rejected
        run: |
          if cargo check -p qv-core --release; then
            echo "::error::default release unexpectedly included the development backend"
            exit 1
          fi
          cargo check -p qv-core --release --no-default-features --features allow_dev_backend_in_release

      - name: Clippy (default features)
        run: cargo clippy --workspace --all-targets -- -D warnings

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install cargo-fuzz
        run: |
          rustup install nightly --no-self-update
          cargo +nightly install cargo-fuzz --locked 2>/dev/null || true

      - name: Fuzz security boundaries (short smoke runs)
        working-directory: crates/qv-core
        run: |
          for target in \
            fuzz_container_parse \
            fuzz_decrypt_pipeline \
            fuzz_kem_handshake \
            fuzz_signature_verify \
            fuzz_wasm_api
          do
            cargo +nightly fuzz run "$target" -- -max_total_time=30 -max_len=4096
          done

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories bans sources

  web:
    name: Web checks (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [22, 24, 26]
    steps:
      - uses: actions/checkout@v7

      - name: Verify incomplete WASM build inputs fail before compilation
        run: python3 -B -m unittest discover -s wasm/tests -v

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: web-demo/package-lock.json

      - name: Verify committed WASM checksums
        working-directory: web-demo
        run: |
          SMAUG_EXPECTED=$(tr -d '[:space:]' < public/smaug.wasm.sha256)
          HAETAE_EXPECTED=$(tr -d '[:space:]' < public/haetae.wasm.sha256)
          test "$(sha256sum public/smaug.wasm | awk '{print $1}')" = "$SMAUG_EXPECTED"
          test "$(sha256sum public/haetae.wasm | awk '{print $1}')" = "$HAETAE_EXPECTED"

      - name: Install dependencies
        working-directory: web-demo
        run: npm ci

      - name: Unit and control tests
        working-directory: web-demo
        run: npm test

      - name: Lint
        working-directory: web-demo
        run: npm run lint -- --max-warnings=0

      - name: Build production bundle
        working-directory: web-demo
        run: npm run build

  browser:
    name: Production-browser behavior
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web-demo/package-lock.json

      - name: Install dependencies
        working-directory: web-demo
        run: npm ci

      - name: Install Playwright browser
        working-directory: web-demo
        run: npx playwright install --with-deps chromium

      - name: Browser pipeline and accessibility gate
        working-directory: web-demo
        run: npm run test:e2e -- --retries=0

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report
          path: web-demo/playwright-report/
          retention-days: 7

      - name: Retain the tested site for a main publish only
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v7
        with:
          name: site-dist
          path: web-demo/dist/
          if-no-files-found: error
          retention-days: 1

  source:
    name: Source reproduction and native KpqC smoke tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Evidence completeness controls
        run: python3 -B -m unittest discover -s wasm/tests -v

      - name: Install Rust toolchain for the native source gate
        uses: dtolnay/rust-toolchain@stable

      - name: Capture and authenticate immutable public source archives
        run: |
          mkdir -p "$RUNNER_TEMP/kpqc-source-inputs"
          curl --fail --location --retry 2 --proto '=https' --tlsv1.2 \
            'https://codeload.github.com/hmchoe0528/SMAUG-T_public/tar.gz/2c039df23134a2de3c7aa86a4904c9a4734f9def' \
            --output "$RUNNER_TEMP/kpqc-source-inputs/smaug.tar.gz"
          curl --fail --location --retry 2 --proto '=https' --tlsv1.2 \
            'https://raw.githubusercontent.com/CryptoLabInc/HAETAE/743c31df48183fc8c8a39a4f50a634da1c4af03a/HAETAE.zip' \
            --output "$RUNNER_TEMP/kpqc-source-inputs/haetae.zip"
          python3 - <<'PY'
          import hashlib
          import json
          import os
          from pathlib import Path

          manifest = json.loads(Path("wasm/reproduction.json").read_text())
          root = Path(os.environ["RUNNER_TEMP"]) / "kpqc-source-inputs"
          for source, archive in (("smaug", "smaug.tar.gz"), ("haetae", "haetae.zip")):
              actual = hashlib.sha256((root / archive).read_bytes()).hexdigest()
              expected = manifest["sources"][source]["sha256"]
              if actual != expected:
                  raise SystemExit(f"{source} archive SHA-256 mismatch: {actual} != {expected}")
          PY

      - name: Compile and exercise the fixed Level 3 / Mode 3 native FFI
        run: |
          mkdir -p "$RUNNER_TEMP/native-smaug" "$RUNNER_TEMP/native-haetae"
          tar -xzf "$RUNNER_TEMP/kpqc-source-inputs/smaug.tar.gz" \
            -C "$RUNNER_TEMP/native-smaug"
          unzip -q "$RUNNER_TEMP/kpqc-source-inputs/haetae.zip" \
            -d "$RUNNER_TEMP/native-haetae"
          SMAUG_T_SRC="$RUNNER_TEMP/native-smaug" \
          HAETAE_SRC="$RUNNER_TEMP/native-haetae" \
            cargo test -p qv-core --no-default-features --features kpqc-native \
              --test differential_tests

      - name: Capture digest-pinned compiler
        run: docker pull --platform linux/amd64 emscripten/emsdk@sha256:7b5d14203bb4ef20da6f5b71b90c8f37ec09c2776d342efff3bc989ebf1aa873

      - name: Clean build and exact four-artifact comparison
        run: |
          bash wasm/build.sh --reproduce \
            --smaug-archive "$RUNNER_TEMP/kpqc-source-inputs/smaug.tar.gz" \
            --haetae-archive "$RUNNER_TEMP/kpqc-source-inputs/haetae.zip" \
            --scratch-root "$RUNNER_TEMP" > "$RUNNER_TEMP/kpqc-source-rebuild.json"

      - name: Retain actual build and error evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: kpqc-source-rebuild
          path: ${{ runner.temp }}/kpqc-source-rebuild.json
          if-no-files-found: error

  pages-artifact:
    name: Prepare Pages artifact
    if: github.event_name != 'pull_request'
    needs: [test, web, browser, source]
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    steps:
      # This privileged job does not check out or execute repository code.
      - name: Download the tested production bundle
        uses: actions/download-artifact@v8
        with:
          name: site-dist
          path: site-dist

      - name: Configure Pages
        uses: actions/configure-pages@v6

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site-dist

  deploy:
    name: Deploy to GitHub Pages
    if: github.event_name != 'pull_request'
    needs: pages-artifact
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  dependabot-auto-merge:
    name: Auto-merge gated non-major dependency updates
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    needs: [test, web, browser, source]
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
      actions: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v3

      - name: Leave major updates for human review
        if: steps.meta.outputs.update-type == 'version-update:semver-major'
        run: echo "Major dependency updates are intentionally not auto-merged."

      - name: Merge a gated patch or minor update and request its deployment
        if: steps.meta.outputs.update-type == 'version-update:semver-patch' || steps.meta.outputs.update-type == 'version-update:semver-minor'
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          merged=
          for attempt in 1 2 3; do
            if gh pr merge --squash --delete-branch "$PR_URL"; then
              merged=1
              break
            fi
            echo "merge attempt $attempt did not land; retrying after base refresh"
            sleep 15
          done
          if [ -z "$merged" ]; then
            echo "::error::gate passed but the dependency PR did not merge"
            exit 1
          fi
          # A merge made with GITHUB_TOKEN raises no push event -- GitHub suppresses
          # them so workflows cannot retrigger themselves -- so deploy would never run
          # and the site would keep serving the previous build. Ask for it explicitly;
          # a workflow_dispatch through the API is not suppressed. The dispatched run
          # is the same gate-then-deploy pipeline, so a bad merge still ships nothing.
          gh workflow run deploy-pages.yml --repo "$GITHUB_REPOSITORY" --ref main
