name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Build and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy

      - name: Cache cargo registry and build artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target/
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: ${{ runner.os }}-cargo-

      - name: Build (default features)
        run: cargo build --workspace

      - name: Run tests (default features)
        run: cargo test --workspace

      - name: Run tamper, corpus, nonce, zeroize, and differential tests
        run: cargo test --workspace -p qv-core --test tamper_tests --test corpus_tests --test nonce_tests --test zeroize_tests --test differential_tests

      - name: Run tests (wasm feature on qv-core)
        run: cargo test -p qv-core --features wasm

      - name: Clippy (default features)
        run: cargo clippy --workspace -- -W clippy::all

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Install cargo-fuzz
        run: |
          rustup install nightly --no-self-update
          cargo +nightly install cargo-fuzz --locked 2>/dev/null || true

      - name: Fuzz container parser (short smoke run)
        working-directory: crates/qv-core
        run: |
          cargo +nightly fuzz run fuzz_container_parse -- -max_total_time=30 -max_len=4096

      - name: Fuzz decrypt pipeline (short smoke run)
        working-directory: crates/qv-core
        run: |
          cargo +nightly fuzz run fuzz_decrypt_pipeline -- -max_total_time=30 -max_len=4096

      - name: Fuzz KEM handshake (short smoke run)
        working-directory: crates/qv-core
        run: |
          cargo +nightly fuzz run fuzz_kem_handshake -- -max_total_time=30 -max_len=4096

      - name: Fuzz signature verify (short smoke run)
        working-directory: crates/qv-core
        run: |
          cargo +nightly fuzz run fuzz_signature_verify -- -max_total_time=30 -max_len=4096

      - name: Fuzz WASM API boundary (short smoke run)
        working-directory: crates/qv-core
        run: |
          cargo +nightly fuzz run fuzz_wasm_api -- -max_total_time=30 -max_len=4096

      - name: Security audit
        run: |
          cargo install cargo-audit --locked
          cargo audit

      - name: Cargo deny
        run: |
          cargo install cargo-deny --locked
          cargo deny check advisories bans sources

  test-web-demo:
    name: Web demo — Vitest
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-demo/package-lock.json

      - name: Install dependencies
        working-directory: web-demo
        run: npm ci

      - name: Run tests
        working-directory: web-demo
        run: npm run test

      - name: Lint (ESLint)
        working-directory: web-demo
        run: npm run lint

      - name: Type-check + build
        working-directory: web-demo
        run: npm run build

  e2e-web-demo:
    name: Web demo — Playwright e2e
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: web-demo/package-lock.json

      - name: Install dependencies
        working-directory: web-demo
        run: npm ci

      - name: Install Playwright browser (Chromium)
        working-directory: web-demo
        run: npm run test:e2e:install

      - name: Run Playwright e2e tests
        working-directory: web-demo
        run: npm run test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: web-demo/playwright-report/
          retention-days: 7

  # Dependabot only. Depends on every gate job in this workflow, so a bump can
  # only merge itself once this lab's whole PR gate went green. Majors are
  # excluded -- the 2026-08-18 batch had to hold back 109 bumps and they were
  # overwhelmingly majors (@noble v2 dropped export subpaths, TypeScript 7,
  # vitest 4), so those still want a human.
  dependabot-auto-merge:
    needs: [test, test-web-demo, e2e-web-demo]
    if: github.event_name == 'pull_request' && github.actor == 'dependabot[bot]'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - id: meta
        uses: dependabot/fetch-metadata@v2
      # Majors included on purpose. `needs:` above already required the whole
      # gate to pass, and that gate -- unit tests, build, axe WCAG and the e2e
      # claims -- judges a bump far better than its version number does. A major
      # that actually breaks this lab fails the gate and stays open for a human.
      - name: Merge any bump whose gate went green
        run: gh pr merge --squash --delete-branch "$PR_URL"
        env:
          PR_URL: ${{ github.event.pull_request.html_url }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
